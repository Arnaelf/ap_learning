<!DOCTYPE html>
<html>
<head>
    <title>GCS - Ground Control Station</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/static/leaflet.css"/>
    <script src="/static/leaflet.js"></script>
    <script src="/static/socket.io.js"></script>
    <style>
        body { margin: 0; font-family: Arial; background: #1a1a2e; color: white; }
        #map { height: 70vh; width: 100%; }
        #telemetry {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #16213e;
        }
        .data-box {
            text-align: center;
            padding: 10px 20px;
            background: #0f3460;
            border-radius: 8px;
        }
        .data-box h3 { margin: 0; color: #e94560; font-size: 14px; }
        .data-box p { margin: 5px 0 0; font-size: 24px; font-weight: bold; }
        h1 { text-align: center; padding: 10px; margin: 0; background: #0f3460; }
    </style>
</head>
<body>
    <h1>✈️ Ground Control Station</h1>
    <div id="map"></div>
    <div id="telemetry">
        <div class="data-box">
            <h3>ВИСОТА</h3>
            <p id="alt">0 м</p>
        </div>
        <div class="data-box">
            <h3>ШВИДКІСТЬ</h3>
            <p id="speed">0 м/с</p>
        </div>
        <div class="data-box">
            <h3>КУРС</h3>
            <p id="heading">0°</p>
        </div>
        <div class="data-box">
            <h3>ГАЗ</h3>
            <p id="throttle">0%</p>
        </div>
        <div class="data-box">
            <h3>БАТАРЕЯ</h3>
            <p id="battery">0%</p>
        </div>
        <div class="data-box">
            <h3>КООРДИНАТИ</h3>
            <p id="coords">--</p>
        </div>
    </div>
    
<script>
window.onload = function() {
    // Ініціалізація карти
    var map = L.map('map').setView([-35.363262, 149.165237], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Іконка літака
    var planeIcon = L.divIcon({
        html: '✈️',
        iconSize: [30, 30],
        className: 'plane-icon'
    });

    // Маркер літака
    var marker = L.marker([-35.363262, 149.165237], {icon: planeIcon}).addTo(map);

    // Трек польоту
    var track = L.polyline([], {color: 'red', weight: 2}).addTo(map);

    // WebSocket підключення
    var socket = io();

    socket.on('telemetry', function(data) {
        // Оновлюємо позицію на карті
        var pos = [data.lat, data.lon];
        marker.setLatLng(pos);
        track.addLatLng(pos);
        map.setView(pos);

        // Оновлюємо телеметрію
        document.getElementById('alt').textContent = data.alt.toFixed(1) + ' м';
        document.getElementById('speed').textContent = data.speed.toFixed(1) + ' м/с';
        document.getElementById('heading').textContent = data.heading.toFixed(0) + '°';
        document.getElementById('throttle').textContent = data.throttle + '%';
        document.getElementById('battery').textContent = data.battery + '%';
        document.getElementById('coords').textContent = 
            data.lat.toFixed(4) + ', ' + data.lon.toFixed(4);
    });
}
</script>
